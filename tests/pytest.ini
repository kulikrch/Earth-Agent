[pytest]
# Pytest configuration for Earth-Agent tests

# Minimum version
minversion = 7.0

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -ra
    --strict-markers
    --strict-config
    --showlocals

# Asyncio configuration (requires pytest-asyncio)
# asyncio_mode = auto  # Commented out - causing issues

# Markers
markers =
    asyncio: Async tests (requires pytest-asyncio)
    unit: Unit tests (isolated components)
    integration: Integration tests (full workflows)
    slow: Slow tests (require more time)

# Coverage options (if pytest-cov installed)
# Run with: pytest --cov=scripts --cov-report=html
